[tool.ruff]
line-length = 100
src = ["."]
extend-exclude = ["venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "ignore:numpy.core:DeprecationWarning",
    "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
